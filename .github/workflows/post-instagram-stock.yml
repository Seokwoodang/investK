name: Post to Instagram (today's stock)

# '화제의 종목 — 왜 움직였나' 캐러셀. 국내·미국 각각 하루 1개, 서로 다른 시간에.
#  · 🇰🇷 국내: 16:30 KST = 07:30 UTC · 평일(월~금)
#      국내장 마감(15:30) 후 등락 확정 시점. 주말·휴장엔 등락률이 금요일 값으로 굳어 제외.
#  · 🇺🇸 미국: 12:30 KST = 03:30 UTC · 화~토
#      미장은 05:00 KST(EDT)에 마감하므로 KST 화~토 낮에 '밤사이 미장' 데이터가 신선하다.
#      월·일에 돌리면 금요일 장 데이터를 며칠 지나 다시 올리게 되므로 제외.
# 조건(|등락| 2% 이상 등)에 맞는 종목이 없으면 카드가 0장이라 503으로 조용히 스킵된다.
on:
  schedule:
    - cron: '30 7 * * 1-5' # 🇰🇷 국내 16:30 KST
    - cron: '30 3 * * 2-6' # 🇺🇸 미국 12:30 KST
  workflow_dispatch:
    inputs:
      region:
        description: '시장(kr|us)'
        default: 'kr'

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve market
        id: r
        run: |
          case "${{ github.event.schedule }}" in
            "30 7 * * 1-5") R=kr ;;
            "30 3 * * 2-6") R=us ;;
            *)              R="${{ github.event.inputs.region || 'kr' }}" ;;
          esac
          echo "region=$R" >> "$GITHUB_OUTPUT"
          echo "→ market=$R"

      - name: Publish stock carousel
        run: |
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' --max-time 170 --retry 1 --retry-delay 20 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://investk.app/api/ig/publish?type=stock&region=${{ steps.r.outputs.region }}")
          cat /tmp/out.json; echo
          if [ "$code" = "503" ]; then
            echo "조건 맞는 종목 없음 — 오늘은 건너뜁니다."
            exit 0
          fi
          [ "$code" = "200" ] || { echo "게시 실패 (HTTP $code)"; exit 1; }
