name: Post to Instagram (today's stock)

# '오늘 화제의 종목 — 왜 움직였나' 캐러셀. 국내장 마감(15:30) 후 그날 등락이 확정된 시점에 게시.
# 16:30 KST = 07:30 UTC. 평일만 — 주말·휴장엔 등락률이 금요일 값으로 굳어 있어
# 같은 종목을 스테일 데이터로 다시 올리게 된다.
# 조건(거래대금 하한·|등락| 2% 이상·보통주)에 맞는 종목이 없으면 카드가 0장이라 503으로 스킵된다.
on:
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Publish today's stock carousel
        run: |
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' --max-time 170 --retry 1 --retry-delay 20 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://investk.app/api/ig/publish?type=stock")
          cat /tmp/out.json; echo
          if [ "$code" = "503" ]; then
            echo "조건 맞는 종목 없음 — 오늘은 건너뜁니다."
            exit 0
          fi
          [ "$code" = "200" ] || { echo "게시 실패 (HTTP $code)"; exit 1; }
