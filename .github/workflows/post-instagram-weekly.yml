name: Post to Instagram (weekly series)

# 주간 시리즈 3종 자동 게시. KST → UTC:
#  · 저평가 우량주 TOP5 : 월 08:30 KST = 일 23:30 UTC
#  · 주간 경제 캘린더    : 일 19:00 KST = 일 10:00 UTC
#  · 투자 용어 1분       : 수 19:00 KST = 수 10:00 UTC
on:
  schedule:
    - cron: '30 23 * * 0' # value (월 아침)
    - cron: '0 10 * * 0'  # calendar (일 저녁)
    - cron: '0 10 * * 3'  # term (수 저녁)
  workflow_dispatch:
    inputs:
      type:
        description: '게시 종류(value|calendar|term)'
        default: 'value'

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve post type
        id: t
        run: |
          case "${{ github.event.schedule }}" in
            "30 23 * * 0") echo "type=value" >> "$GITHUB_OUTPUT" ;;
            "0 10 * * 0")  echo "type=calendar" >> "$GITHUB_OUTPUT" ;;
            "0 10 * * 3")  echo "type=term" >> "$GITHUB_OUTPUT" ;;
            *)             echo "type=${{ github.event.inputs.type || 'value' }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Publish weekly carousel
        run: |
          curl -fsS --max-time 110 --retry 1 --retry-delay 20 -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://investk.app/api/ig/publish?type=${{ steps.t.outputs.type }}"
