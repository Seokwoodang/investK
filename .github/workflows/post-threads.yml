name: Post to Threads

# 스레드 자동 게시. 인스타와 달리 본문 링크가 클릭되므로 사이트로 직접 보낼 수 있다.
# 하루 2회(평일) — 인스타 편성(06:30·16:30·21:30)과 시간이 겹치지 않게 배치.
#  · 16:45 KST 오늘 화제의 종목 → /today/{날짜}   (국장 마감 + 카드 적재 직후)
#  · 12:10 KST 오늘의 투자 용어 → /glossary/{용어}
#  · 토 10:30 KST 주간 마켓 리뷰 → /review/{주차}
on:
  schedule:
    - cron: '45 7 * * 1-5'  # 16:45 KST 평일 — 화제의 종목
    - cron: '10 3 * * 1-5'  # 12:10 KST 평일 — 투자 용어
    - cron: '30 1 * * 6'    # 10:30 KST 토요일 — 주간 리뷰
  workflow_dispatch:
    inputs:
      type:
        description: 'today | review | term'
        default: 'today'

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve type
        id: t
        run: |
          case "${{ github.event.schedule }}" in
            "45 7 * * 1-5") T=today ;;
            "10 3 * * 1-5") T=term ;;
            "30 1 * * 6")   T=review ;;
            *) T="${{ github.event.inputs.type || 'today' }}" ;;
          esac
          # 텍스트형 vs 이미지형 중 무엇이 유입에 유리한지 실측으로 정한다.
          # 현재: 화제의 종목=텍스트+링크카드 / 용어·주간=커버 카드 이미지.
          case "$T" in
            today) IMG=0 ;;
            *)     IMG=1 ;;
          esac
          echo "type=$T" >> "$GITHUB_OUTPUT"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          echo "→ type=$T image=$IMG"
      - name: Publish thread
        run: |
          # 재시도를 걸지 않는다. 서버에 멱등 잠금이 있어 안전하긴 하지만,
          # 왕복이 2회뿐이라 타임아웃으로 끊길 이유가 없다(인스타와 다른 점).
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' --max-time 90 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://investk.app/api/threads/publish?type=${{ steps.t.outputs.type }}&image=${{ steps.t.outputs.image }}")
          cat /tmp/out.json; echo
          # 503 = 올릴 내용 없음(아카이브 비어있음) → 실패로 보지 않는다.
          if [ "$code" = "503" ]; then echo "게시할 내용 없음 — 스킵"; exit 0; fi
          [ "$code" = "200" ] || { echo "HTTP $code"; exit 1; }
