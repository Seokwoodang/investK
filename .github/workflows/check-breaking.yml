name: Breaking market alert (Instagram)

# 급변동 감지 시 '속보'를 단일 이미지로 자동 게시. ~30분마다 감지만 하고,
# 급변동이 있을 때만 게시(엔드포인트가 중복방지·하루 상한 자체 게이트). 릴스 아님(카드 이미지).
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe shock
        id: probe
        run: |
          RESP=$(curl -fsS --max-time 60 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://investk.app/api/cron/breaking?dry=1")
          KEY=$(echo "$RESP" | jq -r '.shock.key // empty')
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          [ -n "$KEY" ] && echo "급변동 감지: $KEY" || echo "급변동 없음"

      - name: Publish breaking image
        if: steps.probe.outputs.key != ''
        run: |
          curl -fsS --max-time 110 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://investk.app/api/ig/publish?type=breaking"

      - name: Mark fired
        if: steps.probe.outputs.key != ''
        run: |
          curl -fsS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://investk.app/api/cron/breaking?mark=${{ steps.probe.outputs.key }}"
